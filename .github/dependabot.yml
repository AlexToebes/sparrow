version: 2

# Weekly update PRs. Minor and patch updates of an ecosystem arrive together in one PR; major
# updates stay separate so they get a deliberate review. The open-PR limit keeps the queue small.
updates:
  - package-ecosystem: npm # also covers the pnpm workspace and pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
